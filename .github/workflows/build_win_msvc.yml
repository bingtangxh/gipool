name: build windows msvc

on:
  push:
    # tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86, x64, ARM64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Build
        run: |
          cl.exe /nologo /O2 /W4 /WX /Z7 /GF /FS /EHsc /W3 /utf-8 gipool.c /link /OUT:gipool_${{ matrix.arch }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gipool-${{ matrix.arch }}-windows
          path: gipool_${{ matrix.arch }}.exe

      - name: Prepare release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ren gipool_${{ matrix.arch }}.exe onsyuri_${{ github.ref_name }}_${{ matrix.arch }}_win.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: onsyuri_${{ github.ref_name }}_${{ matrix.arch }}_win.exe
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
